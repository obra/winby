name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write  # Required for creating releases

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'

    - name: Install dependencies
      run: |
        # Install create-dmg for DMG creation
        brew install create-dmg

    - name: Setup signing certificates
      env:
        DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        DEVELOPER_ID_APPLICATION_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
        DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
        DEVELOPER_ID_INSTALLER_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_PASSWORD }}
      run: |
        # Create temporary keychain
        security create-keychain -p "$RUNNER_TEMP" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$RUNNER_TEMP" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain

        # Import Developer ID Application certificate
        echo "$DEVELOPER_ID_APPLICATION" | base64 --decode > cert.p12
        security import cert.p12 -k build.keychain -P "$DEVELOPER_ID_APPLICATION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm cert.p12

        # Import Developer ID Installer certificate (for DMG signing)
        echo "$DEVELOPER_ID_INSTALLER" | base64 --decode > installer.p12
        security import installer.p12 -k build.keychain -P "$DEVELOPER_ID_INSTALLER_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
        rm installer.p12

        # Allow codesign to access the keychain
        security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain

    - name: Build Swift package
      run: |
        # Resolve dependencies first
        swift package resolve

        # Patch KeyboardShortcuts to not crash on missing bundle
        UTILS=".build/checkouts/KeyboardShortcuts/Sources/KeyboardShortcuts/Utilities.swift"
        if [ -f "$UTILS" ]; then
          echo "Patching KeyboardShortcuts Utilities.swift..."
          chmod u+w "$UTILS"
          sed -i '' 's/bundle: \.module/bundle: .keyboardShortcutsBundle/g' "$UTILS"
          echo '' >> "$UTILS"
          echo '// Patched by Winby CI - flexible bundle lookup for app distribution' >> "$UTILS"
          echo 'extension Bundle {' >> "$UTILS"
          echo '    static let keyboardShortcutsBundle: Bundle = {' >> "$UTILS"
          echo '        let bundleName = "KeyboardShortcuts_KeyboardShortcuts.bundle"' >> "$UTILS"
          echo '        let candidates = [' >> "$UTILS"
          echo '            Bundle.main.resourceURL?.appendingPathComponent(bundleName),' >> "$UTILS"
          echo '            Bundle.main.bundleURL.appendingPathComponent(bundleName),' >> "$UTILS"
          echo '            Bundle.main.executableURL?.deletingLastPathComponent().appendingPathComponent(bundleName)' >> "$UTILS"
          echo '        ]' >> "$UTILS"
          echo '        for candidate in candidates {' >> "$UTILS"
          echo '            if let path = candidate?.path, let bundle = Bundle(path: path) {' >> "$UTILS"
          echo '                return bundle' >> "$UTILS"
          echo '            }' >> "$UTILS"
          echo '        }' >> "$UTILS"
          echo '        return Bundle.main' >> "$UTILS"
          echo '    }()' >> "$UTILS"
          echo '}' >> "$UTILS"
          echo "Patched Utilities.swift"
        fi

        # Build
        swift build --configuration release --arch arm64

    - name: Create app bundle structure
      run: |
        APP_NAME="Winby"
        APP_BUNDLE="$APP_NAME.app"
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"  # Remove 'v' prefix if present

        # Remove any existing bundle
        rm -rf "$APP_BUNDLE"

        # Create bundle directories
        mkdir -p "$APP_BUNDLE/Contents/MacOS"
        mkdir -p "$APP_BUNDLE/Contents/Resources"
        mkdir -p "$APP_BUNDLE/Contents/Frameworks"

        # Copy executable
        cp .build/arm64-apple-macosx/release/$APP_NAME "$APP_BUNDLE/Contents/MacOS/"

        # Copy Swift package dependency bundles to Resources
        ARCH_DIR=".build/arm64-apple-macosx/release"
        if [ -d "$ARCH_DIR" ]; then
          echo "Copying bundles from: $ARCH_DIR"
          find "$ARCH_DIR" -name "*.bundle" -type d | while read bundle; do
            bundle_name=$(basename "$bundle")
            echo "Copying resource bundle: $bundle"
            cp -R "$bundle" "$APP_BUNDLE/Contents/Resources/"
            # Fix permissions
            find "$APP_BUNDLE/Contents/Resources/$bundle_name" -type f -exec chmod 644 {} \;
          done
        fi

        # Copy Sparkle framework
        SPARKLE_FRAMEWORK=".build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework"
        if [ -d "$SPARKLE_FRAMEWORK" ]; then
          echo "Copying Sparkle framework"
          cp -R "$SPARKLE_FRAMEWORK" "$APP_BUNDLE/Contents/Frameworks/"
        fi

        # Fix rpath so executable can find Sparkle in Frameworks
        install_name_tool -add_rpath "@executable_path/../Frameworks" "$APP_BUNDLE/Contents/MacOS/$APP_NAME"

        # Create Info.plist
        cat > "$APP_BUNDLE/Contents/Info.plist" << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDisplayName</key>
            <string>Winby</string>
            <key>CFBundleExecutable</key>
            <string>Winby</string>
            <key>CFBundleIdentifier</key>
            <string>com.winby.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Winby</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$VERSION</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>CFBundleIconFile</key>
            <string>Winby</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHumanReadableCopyright</key>
            <string>Copyright 2025 Jesse Vincent</string>
            <key>SUFeedURL</key>
            <string>https://github.com/obra/winby/releases/latest/download/appcast.xml</string>
            <key>SUPublicEDKey</key>
            <string>${{ secrets.SPARKLE_PUBLIC_KEY }}</string>
        </dict>
        </plist>
        EOF

        # Copy resources (icon, etc.)
        if [ -d "Resources" ]; then
          cp -R Resources/* "$APP_BUNDLE/Contents/Resources/" 2>/dev/null || true
        fi

    - name: Sign app bundle
      env:
        DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
      run: |
        APP_BUNDLE="Winby.app"

        echo "Signing app bundle components..."

        # Sign Sparkle framework first (inside-out signing)
        if [ -d "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework" ]; then
          echo "Signing Sparkle framework..."
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" \
            "$APP_BUNDLE/Contents/Frameworks/Sparkle.framework"
        fi

        # Sign dependency bundles in Resources
        find "$APP_BUNDLE/Contents/Resources" -name "*.bundle" -type d | while read bundle; do
          echo "Signing bundle: $bundle"
          codesign --force --options runtime --sign "$DEVELOPER_ID_NAME" "$bundle"
        done

        # Sign the main executable
        echo "Signing main executable..."
        codesign --force --options runtime --entitlements Winby.entitlements --sign "$DEVELOPER_ID_NAME" "$APP_BUNDLE/Contents/MacOS/Winby"

        # Sign the app bundle itself (outermost)
        echo "Signing app bundle..."
        codesign --force --options runtime --entitlements Winby.entitlements --sign "$DEVELOPER_ID_NAME" "$APP_BUNDLE"

        # Verify signature
        echo "Verifying signatures..."
        codesign --verify --verbose=4 "$APP_BUNDLE"

        # Check Gatekeeper status
        echo "Checking Gatekeeper status (expected to be rejected before notarization):"
        spctl --assess --verbose "$APP_BUNDLE" || echo "App rejected as expected - will be resolved by notarization"

    - name: Create DMG
      run: |
        APP_NAME="Winby"
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"
        DMG_NAME="${APP_NAME}-${VERSION}.dmg"

        create-dmg \
          --volname "$APP_NAME" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "$APP_NAME.app" 200 190 \
          --hide-extension "$APP_NAME.app" \
          --app-drop-link 600 185 \
          --hdiutil-quiet \
          "$DMG_NAME" \
          "$APP_NAME.app" || true

        # If create-dmg fails, create a simple DMG
        if [ ! -f "$DMG_NAME" ]; then
          echo "create-dmg failed, creating simple DMG"
          hdiutil create -srcfolder "$APP_NAME.app" -volname "$APP_NAME" "$DMG_NAME"
        fi

    - name: Sign DMG
      env:
        DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"
        DMG_NAME="Winby-${VERSION}.dmg"

        # Sign the DMG
        codesign --force --sign "$DEVELOPER_ID_NAME" "$DMG_NAME"

        # Verify DMG signature
        codesign --verify --verbose "$DMG_NAME"

    - name: Notarize app
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"
        DMG_NAME="Winby-${VERSION}.dmg"

        # Submit for notarization
        xcrun notarytool submit "$DMG_NAME" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait

        # Staple the notarization
        xcrun stapler staple "$DMG_NAME"

    - name: Generate Sparkle appcast
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"
        DMG_NAME="Winby-${VERSION}.dmg"

        # Get file size and generate signature
        FILE_SIZE=$(stat -f%z "$DMG_NAME")

        # Generate EdDSA signature using Sparkle's sign_update tool
        echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key
        SIGNATURE=$(.build/artifacts/sparkle/Sparkle/bin/sign_update "$DMG_NAME" -f /tmp/sparkle_private_key)
        rm /tmp/sparkle_private_key

        # Create appcast.xml
        cat > appcast.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel>
            <title>Winby</title>
            <link>https://github.com/obra/winby/releases</link>
            <description>Most recent changes with links to updates.</description>
            <language>en</language>
            <item>
              <title>Version $VERSION</title>
              <pubDate>$(date -R)</pubDate>
              <sparkle:version>${{ github.run_number }}</sparkle:version>
              <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              <enclosure url="https://github.com/obra/winby/releases/download/v$VERSION/$DMG_NAME"
                         sparkle:edSignature="$SIGNATURE"
                         length="$FILE_SIZE"
                         type="application/octet-stream"/>
            </item>
          </channel>
        </rss>
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Winby-${{ github.event.inputs.version || github.ref_name }}
        path: |
          Winby-*.dmg
          appcast.xml

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        VERSION="${VERSION#v}"
        DMG_NAME="Winby-${VERSION}.dmg"

        # Create release using GitHub CLI
        gh release create "${{ github.ref_name }}" \
          "$DMG_NAME" \
          "appcast.xml" \
          --title "Winby ${{ github.ref_name }}" \
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cleanup keychain
      if: always()
      run: |
        security delete-keychain build.keychain || true
